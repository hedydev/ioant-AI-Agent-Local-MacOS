<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="console-token" content="{{CONSOLE_TOKEN}}"><title>OpenClaw Console</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body><div class="shell">
 <aside class="sidebar"><a class="brand" href="/" aria-label="OpenClaw Console"><span class="brand-mark">⌘</span><span>OpenClaw<span class="brand-sub">LOCAL CONSOLE</span></span></a>
  <div class="workspace-label" data-i18n="nav.workspace"></div><nav id="navigation"></nav>
  <div class="sidebar-rule"></div><div class="workspace-label" data-i18n="nav.projects"></div><div id="project-nav" class="project-nav"></div>
  <div class="sidebar-bottom"><span class="local-dot"></span><span data-i18n="nav.local"></span><code>127.0.0.1</code></div>
 </aside>
 <div class="workspace"><header class="topbar"><div class="breadcrumb"><span data-i18n="nav.workspace"></span><span>/</span><strong id="view-title"></strong></div><div class="preferences"><span id="stream-status" class="stream-status"></span><select id="locale" aria-label="Language"><option value="system">System language</option><option value="zh-CN">简体中文</option><option value="en-US">English</option></select><select id="theme" aria-label="Appearance"></select></div></header>
 <main><div class="page-heading"><div><div class="eyebrow">OPENCLAW / MCP</div><h1 data-i18n="page.title"></h1><p data-i18n="page.subtitle"></p></div><button id="export" class="button secondary" data-i18n="action.export"></button></div>
  <div id="persistent-error" class="notice danger" hidden></div>
  <section id="tunnel-status" class="status-panel" aria-live="polite"></section>
  <section id="metrics" class="metrics"></section>
  <section id="view-overview" class="view"><div class="panel flow-panel"><div class="section-heading"><div><h2 data-i18n="flow.title"></h2><p data-i18n="flow.subtitle"></p></div><span class="tiny-label">MCP · STDIO · HTTPS</span></div><div id="connection-flow" class="connection-flow"></div></div>
   <div class="overview-grid"><section class="panel"><div class="section-heading"><h2 data-i18n="activity.recent"></h2><button class="text-button" data-go="activity" data-i18n="action.viewAll"></button></div><div id="recent-activity"></div></section><section class="panel"><div class="section-heading"><h2 data-i18n="communications.title"></h2><span class="live-label" data-i18n="common.live"></span></div><div id="recent-communications"></div></section></div>
  </section>
  <section id="view-activity" class="view" hidden><div class="panel"><div class="section-heading"><div><h2 data-i18n="activity.title"></h2><p data-i18n="activity.subtitle"></p></div></div><div class="filters"><select id="project-filter" aria-label="Project"></select><select id="state-filter" aria-label="State"></select><input id="activity-search" type="search" data-placeholder="activity.search"></div><div id="all-activity"></div></div></section>
  <section id="view-logs" class="view" hidden><div class="panel"><div class="section-heading"><div><h2 data-i18n="logs.title"></h2><p data-i18n="logs.subtitle"></p></div><div class="button-row"><button id="pause-logs" class="button secondary" data-i18n="action.pause"></button><button id="info-logs" class="button secondary" data-i18n="action.infoLogs"></button></div></div><div class="filters"><select id="log-filter" aria-label="Log level"></select><input id="log-search" type="search" data-placeholder="logs.search"></div><div id="log-feed" class="log-feed"></div><div id="log-location" class="panel-footer"></div></div></section>
  <footer class="page-footer"><span data-i18n="footer.scope"></span><span id="last-update"></span></footer>
 </main></div>
</div>
<dialog id="control-dialog"><form id="control-form"><div class="dialog-heading"><span class="dialog-symbol">⌘</span><button type="button" class="icon-button" id="dialog-cancel" aria-label="Close">×</button></div><h2 id="dialog-title"></h2><p id="dialog-description"></p><label id="key-label"><span data-i18n="control.key"></span><input id="runtime-key" type="password" autocomplete="off" spellcheck="false" maxlength="512" placeholder="sk-…"></label><div id="dialog-error" class="notice danger" hidden></div><div class="dialog-actions"><button type="button" id="dialog-back" class="button secondary" data-i18n="action.cancel"></button><button type="submit" id="dialog-submit" class="button primary"></button></div></form></dialog>
<dialog id="report-dialog" class="report-dialog"><div class="dialog-heading"><div><div class="eyebrow" data-i18n="report.eyebrow"></div><h2 id="report-title"></h2></div><button id="report-close" class="icon-button" aria-label="Close">×</button></div><div class="report-toolbar"><select id="report-artifact" aria-label="Artifact"></select><button id="report-next" class="button secondary" data-i18n="report.next"></button></div><p id="report-meta" class="muted"></p><pre id="report-content" tabindex="0"></pre></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
